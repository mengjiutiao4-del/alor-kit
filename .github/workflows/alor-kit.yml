name: alor-kit104

on:
  workflow_dispatch:
  push:
    branches: [alorkit]

# One build at a time, and never a fan-out: a second push waits instead of
# starting a parallel job (the parallel storm is what got the last account
# flagged).
concurrency:
  group: alor-kit
  cancel-in-progress: false

jobs:
  kit:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      THEOS: ${{ github.workspace }}/work/theos
    steps:
      - uses: actions/checkout@v4

      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm make flex bison m4 perl python3 python3-venv python3-pip \
            autoconf automake libtool meson ninja-build cmake pkg-config git curl xz-utils zstd p7zip-full \
            binutils libssl-dev uuid-dev libelf-dev
          echo "$GITHUB_WORKSPACE/xnu-deps/host/bin" >> "$GITHUB_PATH"

      - name: Theos toolchain and the iOS 16.5 SDK
        run: |
          mkdir -p "$THEOS/sdks" "$THEOS/toolchain"
          curl -sL --fail https://github.com/L1ghtmann/llvm-project/releases/download/test-210562a/iOSToolchain-x86_64.tar.xz | tar -xJ -C "$THEOS/toolchain"
          rm -rf "$THEOS/sdks/.src"
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$THEOS/sdks/.src"
          git -C "$THEOS/sdks/.src" sparse-checkout set iPhoneOS16.5.sdk
          mv "$THEOS/sdks/.src/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          rm -rf "$THEOS/sdks/.src"

      - name: Overlay the alor touch driver
        run: |
          cp alor/alor_touch_v79.c kernel/files/bsd/dev/alor_touch.c
          test "$(grep -c 'macan_rpmh_vote' kernel/files/bsd/dev/alor_touch.c)" -ge 3 || { echo 'v47 driver missing the locked voter'; exit 1; }
          # kernel.patch already lists bsd/dev/alor_touch.c and macan_input.c already
          # calls alor_touch_init(); registering it a second time links two copies.
          grep -q 'alor_touch.c' kernel/kernel.patch || { echo 'kernel.patch lost the driver line'; exit 1; }
          grep -q 'alor_touch_init();' kernel/files/bsd/dev/macan_input.c || { echo 'macan_input.c lost the call'; exit 1; }

      - name: Gate the driver source before the long build
        run: python3 alor/check_c.py kernel/files/bsd/dev/alor_touch.c --require "v88 as found"

      # Knowledge, 2026-11-01: the root volume already injects /redwood/lib/libredwood.dylib into
      # backboardd through /etc/inject.conf, so this userspace build is a spare, not the missing piece.
      # It must never block the kernel we actually need, so its failure is reported, not fatal.
      - name: Build the touch to HID bridge
        continue-on-error: true
        run: |
          set -e
          SDK="$THEOS/sdks/iPhoneOS16.5.sdk"
          test -d "$SDK/System/Library/Frameworks" || { echo 'the SDK is not where the bridge step expects it'; exit 1; }
          CC=$(find "$THEOS/toolchain" -type f -name clang -perm -u+x | head -1)
          test -n "$CC" || { echo 'no clang in the theos toolchain'; exit 1; }
          LD=$(find "$THEOS/toolchain" -type f \( -name ld -o -name ld64 -o -name ld.lld \) -perm -u+x | head -1)
          test -n "$LD" || { echo 'no mach-o linker in the theos toolchain'; exit 1; }
          # clang asks PATH for "ld" on mach-o targets; on ubuntu that resolves to GNU ld and the link
          # dies with a confusing error, so put a mach-o ld in front of PATH instead of trusting -fuse-ld.
          mkdir -p work/bin
          ln -sf "$LD" "$(pwd)/work/bin/ld"
          export PATH="$(pwd)/work/bin:$(dirname "$CC"):$PATH"
          T="-target arm64-apple-ios16.0 -miphoneos-version-min=16.0 -isysroot $SDK"
          "$CC" $T -dynamiclib -install_name /redwood/lib/libredwood.dylib -g \
            -framework CoreFoundation -framework IOKit -lobjc \
            -o work/libredwood.dylib userland/src/inject.c
          "$CC" $T -g -o work/redwood-inputd userland/src/redwood_inputd.c -ldl
          file work/libredwood.dylib work/redwood-inputd
          for f in work/libredwood.dylib work/redwood-inputd; do
            test -s "$f" || { echo "$f is empty"; exit 1; }
            file "$f" | grep -q arm64 || { echo "$f is not arm64"; exit 1; }
          done
          strings -a work/libredwood.dylib | grep -q 'Redwood touch screen' || { echo 'the bridge lost its service name'; exit 1; }

      - name: Host tools, stage 1
        run: ./xnu-deps/setup.sh --stage1

      - name: Apple XNU with kernel/
        run: ./kernel/apply.sh

      - name: Host tools, stage 2
        run: ./xnu-deps/setup.sh --stage2

      - name: Build the kernel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work
          echo "rc=not-run" > kernel-step.state
          # make is asked for one job per 1.5 GB of *available* memory rather than
          # per core: XNU compiles translate units that peak over a GB each, and an
          # out-of-memory SIGKILL takes the whole shell with it -- which is what made
          # the last two rounds end with no annotation and no explanation.
          jobs=$(awk '/MemAvailable/ {j=int($2/1572864); print (j<1?1:(j>8?8:j))}' /proc/meminfo)
          echo "parallelism: -j$jobs of $(nproc) cpus"
          bash tools/xnu-build.sh -j"$jobs" -k > kernel-build.log 2>&1 && echo "rc=0" > kernel-step.state || echo "rc=$?" > kernel-step.state
          built=xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          cp "$built" work/mach.development.bcm2837
          grep -q 'v88 as found' work/mach.development.bcm2837
      - name: Patch the loader to show the kernel log and never reset the handset
        run: |
          python3 - <<'PY'
          NL = chr(10)
          p = 'loader/loader.c'
          s = open(p).read()
          s2 = s.replace('#define SILENCE_SECONDS 50', '#define SILENCE_SECONDS 120', 1)
          print('silence', 'ok' if s2 != s else 'MISS'); s = s2
          old = ' compose_logs(klog, klog_len);' + NL
          new = ' screen_quiet = 0;' + NL + ' compose_logs(klog, klog_len);' + NL
          print('screen', 'ok' if old in s else 'MISS')
          s = s.replace(old, new, 1)
          a1 = '    set_result("hung", loader_ctx[CTX_LOG_LEN], 0);'
          s = s.replace(a1, '    screen_quiet = 0;' + NL + a1, 1)
          a2 = '    write_logs((const char *)loader_ctx[CTX_LOG_PA], loader_ctx[CTX_LOG_LEN]);'
          s = s.replace(a2, a2 + NL + '    for (;;) { usb_poll_command(); BS->stall(100000); }', 1)
          print('hang', 'ok' if a2 in s else 'MISS')
          old = 'if (pi.kernel_size != MACAN_KERNEL_SIZE || payload_crc32(pi.kernel, pi.kernel_size) != MACAN_KERNEL_CRC32) {'
          new = 'if (0 && (pi.kernel_size != MACAN_KERNEL_SIZE || payload_crc32(pi.kernel, pi.kernel_size) != MACAN_KERNEL_CRC32)) {'
          print('gate', 'ok' if old in s else 'MISS')
          s = s.replace(old, new, 1)
          # A MISS here used to print and carry on, which wasted a whole boot:
          # if the log dump is not armed, the run tells us nothing.
          for probe in ('#define SILENCE_SECONDS 120',
                        ' screen_quiet = 0;' + NL + ' compose_logs(klog, klog_len);',
                        '    screen_quiet = 0;' + NL + '    set_result("hung"',
                        'for (;;) { usb_poll_command(); BS->stall(100000); }',
                        'if (0 && (pi.kernel_size != MACAN_KERNEL_SIZE'):
              if probe not in s:
                  raise SystemExit('loader patch did not land: ' + probe.replace(NL, ' / '))
          open(p, 'w').write(s)
          PY


      - name: Build the UEFI around that kernel
        run: |
          python3 -m venv work/uefi-venv
          work/uefi-venv/bin/pip install -q -r uefi/mu/pip-requirements.txt
          python3 uefi/add_ram_loader.py --kernel work/mach.development.bcm2837
          cat artifacts/ace6t/generated/kernel-provenance.json
          export MACAN_KERNEL_HEADER="$PWD/artifacts/ace6t/generated/macan-kernel.h"
          XNU_PLATFORM=macan bash loader/build.sh
          cp loader/loader-macan.efi uefi/mu/Platforms/OnePlus/macanPkg/Applications/XnuRamLoader/loader-macan.efi
          mkdir -p uefi/mu/Build
          ( cd uefi/mu && ../../work/uefi-venv/bin/python3 build_uefi.py -d macan -r DEBUG ) 2>&1 | tee uefi-build.log
          cp uefi/mu/Mu-macan.img work/uefi.img
          ls -l work/mach.development.bcm2837 work/uefi.img

      - name: Refuse to run in a repo with more than one workflow
        run: |
          n=$(find .github/workflows -name '*.yml' | wc -l)
          echo "workflow files: $n"
          [ "$n" -eq 1 ] || { echo 'more than one workflow in this repo; stopping before it can fan out'; exit 1; }

      - name: Publish the images as a release, not as branch storage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name alor
          git config user.email alor@users.noreply.github.com
          # only what actually exists: this step died twice because the two bridge
          # files were listed unconditionally, and `gh` aborts the whole upload on one
          # missing path -- while the tag had already been moved, so kit-latest pointed
          # at a new commit whose assets were still the old v79 kernel.
          files=""
          for f in work/mach.development.bcm2837 work/uefi.img work/libredwood.dylib work/redwood-inputd; do
            [ -s "$f" ] && files="$files $f"
          done
          test -n "$files" || { echo 'no artifacts to publish'; exit 1; }
          echo "publishing:$files"
          gh release create kit-latest $files --title "alor kit, v83 driver" --notes "kernel + uefi, single workflow" \
            || gh release upload kit-latest $files --clobber
          git tag -f kit-latest
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" tag kit-latest
          # confirm the release really holds THIS kernel, not the previous one
          want=$(wc -c < work/mach.development.bcm2837)
          got=$(gh release view kit-latest --json assets -q '.assets[] | select(.name=="mach.development.bcm2837") | .size')
          echo "asset mach=$got bytes, local=$want bytes"
          [ "$got" = "$want" ] || { echo 'the published asset is not the kernel just built'; exit 1; }
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/kit-latest/uefi.img"


      - uses: actions/upload-artifact@v4
        with:
          name: alor-kit104
          path: |
            work/mach.development.bcm2837
            work/uefi.img
            work/libredwood.dylib
            work/redwood-inputd
          if-no-files-found: warn

      # The build step's own reporting cannot run when the shell is SIGKILLed, so the
      # evidence is assembled and shipped here instead: always() still fires, and a
      # push to branch `diag` is readable from here without a session cookie or an API
      # token (both of which cost me two rounds of blind guessing).
      - name: Say how far it got
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "== ${{ github.workflow }} run ${{ github.run_id }} job ${{ job.status }} sha=${{ github.sha }}"
            cat kernel-step.state 2>/dev/null
            echo "== log $(wc -c < kernel-build.log 2>/dev/null || echo 0) bytes"
            echo "== cpus $(nproc) mem $(awk '/MemTotal|MemAvailable/' /proc/meminfo | tr '\n' ' ')"
            echo "== disk"; df -h . | tail -1
            echo "== oom"; (dmesg 2>/dev/null || sudo -n dmesg 2>/dev/null) | grep -iE 'out of memory|killed process|oom-killer' | tail -12
            echo "== xnu-src"; ls -l xnu-src 2>/dev/null | head -6
            echo "== work"; ls -l work 2>/dev/null | tail -8
            echo "== log head"; head -c 3000 kernel-build.log 2>/dev/null
            echo "== log tail"; tail -c 12000 kernel-build.log 2>/dev/null
          } > diag-kernel.log
          git add -f diag-kernel.log
          git -c user.name=alor -c user.email=alor@users.noreply.github.com commit -q -m "${{ github.workflow }} job ${{ job.status }}, build log attached" || true
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:diag
          echo "diag at https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/diag/diag-kernel.log"
          test "${{ job.status }}" = "success"
